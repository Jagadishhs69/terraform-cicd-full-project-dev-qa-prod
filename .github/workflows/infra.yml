name: Terraform Infra Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, staging, prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.ref_name == 'dev' && 'dev' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'prod' && 'prod' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false # Disable wrapper to capture raw CLI output

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./environment/dev

      - name: Terraform Plan
        run: terraform plan -var-file="../../tfvars/${{ env.ENVIRONMENT }}.tfvars" -no-color > tfplan-${{ env.ENVIRONMENT }}.txt 2>&1
        working-directory: ./environment/${{ env.ENVIRONMENT }}
          # terraform plan -out=tfplan
          # terraform show -no-color tfplan > plan.txt
        # env:
        #   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify Plan File
        run: |
          ls -l tfplan-${{ env.ENVIRONMENT }}.txt
          cat tfplan-${{ env.ENVIRONMENT }}.txt
        working-directory: ./environment/${{ env.ENVIRONMENT }}
        continue-on-error: true # Allow debugging if file is missing

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ./environment/${{ env.ENVIRONMENT }}/tfplan-${{ env.ENVIRONMENT }}.txt
          retention-days: 5

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'dev' && 'dev' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'prod' && 'prod' }}

    env:
      ENVIRONMENT: ${{ github.ref_name == 'dev' && 'dev' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'prod' && 'prod' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # - name: Download Terraform Plan Artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: tfplan-${{ env.ENVIRONMENT }}
      #     path: ./environment/${{ env.ENVIRONMENT }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./environment/dev

      - name: Terraform Apply
        run:  terraform apply -auto-approve -var-file="../../tfvars/${{ env.ENVIRONMENT }}.tfvars"
        working-directory: ./environment/dev
        # env:
        #   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
