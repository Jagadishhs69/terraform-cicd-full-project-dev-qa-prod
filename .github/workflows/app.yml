name: Deploy Node.js Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (dev/qa)"
        required: true
        default: "dev"

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Authenticate with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Fetch RDS secrets from Secrets Manager
      - name: Fetch DB Secrets
        run: |
          echo "Fetching DB secrets from Secrets Manager..."
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id ${{ github.event.inputs.environment }}/rds-credentials96 \
            --query SecretString --output text)

          echo "SECRET_STRING=$SECRET" >> $GITHUB_ENV
          echo "DB_USER=$(echo $SECRET | jq -r .username)" >> $GITHUB_ENV
          echo "DB_PASSWORD=$(echo $SECRET | jq -r .password)" >> $GITHUB_ENV
          echo "DB_HOST=$(echo $SECRET | jq -r .host)" >> $GITHUB_ENV
          echo "DB_PORT=$(echo $SECRET | jq -r .port)" >> $GITHUB_ENV

          # Fallback dbname if not found
          DB_NAME=$(echo $SECRET | jq -r '.dbname // empty')
          if [ -z "$DB_NAME" ] || [ "$DB_NAME" == "null" ]; then
            DB_NAME="postgres"
          fi
          echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV

      # Build, Tag and Push Docker image
      - name: Build, Tag, and Push Docker image
        run: |
          IMAGE_REPO="${{ steps.login-ecr.outputs.registry }}/${{ github.event.inputs.environment }}-nodejs-app"
          IMAGE_TAG="latest"

          echo "Building Docker image..."
          docker build -t $IMAGE_REPO:$IMAGE_TAG .

          echo "Pushing Docker image to ECR..."
          docker push $IMAGE_REPO:$IMAGE_TAG

      # Deploy Application Container via SSM
      - name: Deploy Application Container via SSM
        run: |
          echo "Fetching EC2 instance ID..."
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ github.event.inputs.environment }}-app-server" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "❌ No EC2 instance found with Name tag '${{ github.event.inputs.environment }}-app-server'"
            exit 1
          fi

          echo "Sending SSM command to deploy container on EC2 ($INSTANCE_ID)..."
          aws ssm send-command \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Node.js App container" \
            --parameters 'commands=[
              "docker stop nodejs-app || true",
              "docker rm nodejs-app || true",
              "aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'",
              "docker pull '${{ steps.login-ecr.outputs.registry }}/${{ github.event.inputs.environment }}-nodejs-app:latest'",
              "docker run -d --name nodejs-app -p 80:3000 \
                -e DB_USER=${DB_USER} \
                -e DB_PASSWORD=${DB_PASSWORD} \
                -e DB_HOST=${DB_HOST} \
                -e DB_PORT=${DB_PORT} \
                -e DB_NAME=${DB_NAME} \
                '${{ steps.login-ecr.outputs.registry }}/${{ github.event.inputs.environment }}-nodejs-app:latest'"
            ]'
